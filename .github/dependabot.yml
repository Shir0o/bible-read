version: 2
updates:
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      flutter-dependencies:
        patterns:
          - "*"

  # Keeps the commit-SHA pins in .github/workflows/*.yml current. Dependabot
  # understands the uses: owner/repo@<sha> # vX form and rewrites both the SHA
  # and the version comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
