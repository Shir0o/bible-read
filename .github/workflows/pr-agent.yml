name: Codium PR-Agent

on:
  pull_request:
    types: [opened, reopened, synchronize]
  issue_comment:
    types: [created]

jobs:
  pr_agent_job:
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: write
    steps:
      - name: PR Agent action step
        id: pragent
        uses: the-pr-agent/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Model id must use LiteLLM's provider prefix (gemini/...), NOT PR-Agent's
          # config-section name (google_ai_studio/...). The latter makes LiteLLM
          # abort with "LLM Provider NOT provided". The API key still comes from the
          # GOOGLE_AI_STUDIO__GEMINI_API_KEY env var below.
          #
          # gemini-1.5-pro was retired from the Google AI Studio (Generative
          # Language) API — it now returns "is not found for API version v1beta,
          # or is not supported for generateContent", which surfaced as
          # "Failed to generate code suggestions for PR". Use a current model.
          CONFIG__MODEL: "gemini/gemini-2.5-flash"
          # Override the default fallback chain (which points at a model we can't
          # reach) — fall back to another current Gemini model.
          CONFIG__FALLBACK_MODELS: '["gemini/gemini-2.0-flash"]'
          GOOGLE_AI_STUDIO__GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
