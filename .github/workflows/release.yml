name: Release

# Triggered when release-please pushes a version tag (e.g. v1.25.0).
# Builds a signed APK + AAB (each carrying the derived versionCode from
# the tag), attaches both to the GitHub Release, and uploads the AAB
# to the Play Console internal testing track via fastlane supply.
# Production promotion stays a manual Play Console click.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build, attach, and upload release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production  # no reviewers configured = auto-approve; see RELEASING.md
    steps:
      - name: Checkout repository at tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify all release secrets are present
        id: check-secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          PLAY_SUPPLY_JSON_KEY: ${{ secrets.PLAY_SUPPLY_JSON_KEY }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          missing=()
          for var in ANDROID_KEYSTORE_BASE64 KEY_ALIAS KEY_PASSWORD STORE_PASSWORD PLAY_SUPPLY_JSON_KEY GOOGLE_SERVICES_JSON; do
            if [ -z "${!var:-}" ]; then
              missing+=("$var")
            fi
          done
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing required GitHub secrets: ${missing[*]}"
            echo "::error::See RELEASING.md for setup instructions."
            exit 1
          fi
          echo "All release secrets present."

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Ruby + Bundler for fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: false

      - name: Install Ruby dependencies
        run: bundle install

      - name: Install dependencies
        run: flutter pub get

      - name: Seed google-services.json from secrets
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          chmod 600 android/app/google-services.json
          echo "google-services.json mounted (contents not echoed)."

      - name: Assemble CI keystore and key.properties
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p ~/.keystores
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > ~/.keystores/upload-key.keystore
          chmod 600 ~/.keystores/upload-key.keystore
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=$HOME/.keystores/upload-key.keystore
          EOF
          chmod 600 android/key.properties
          echo "CI keystore and key.properties assembled (file contents not echoed)."

      - name: Derive Android versionCode from tag (major*10000 + minor*100 + patch)
        id: vc
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          ver="${tag#v}"
          ver="${ver%%-*}"
          IFS='.' read -r major minor patch <<< "$ver"
          if [ -z "$major" ] || [ -z "$minor" ] || [ -z "$patch" ]; then
            echo "::error::Could not parse semver from tag '$tag' (parsed major='$major' minor='$minor' patch='$patch')."
            exit 1
          fi
          code=$(( 10#$major * 10000 + 10#$minor * 100 + 10#$patch ))
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Derived versionCode=$code from tag $tag (major=$major minor=$minor patch=$patch)"

      - name: Bootstrap Android project (Generates gradlew)
        run: flutter build apk --debug
        env:
          CI: 'true'

      - name: Build signed release AAB
        run: flutter build appbundle --release --no-tree-shake-icons --build-number=${{ steps.vc.outputs.code }}

      - name: Build signed release APK
        run: flutter build apk --release --no-tree-shake-icons --build-number=${{ steps.vc.outputs.code }}

      - name: Locate built artifacts
        id: locate
        run: |
          set -euo pipefail
          AAB=$(find build/app/outputs/bundle/release -name '*.aab' | head -n1)
          APK=$(find build/app/outputs/flutter-apk -name 'app-release.apk' | head -n1)
          if [ -z "$AAB" ] || [ -z "$APK" ]; then
            echo "::error::Built artifacts not found. Expected AAB and APK under build/app/outputs/."
            exit 1
          fi
          echo "aab=$AAB" >> "$GITHUB_OUTPUT"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "Located AAB=$AAB and APK=$APK"

      - name: Check if release artifacts are already attached (idempotency)
        id: check-existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          existing_aab=$(gh release view "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --json assets \
            --jq '.assets[] | select(.name | endswith(".aab")) | .name' \
            2>/dev/null || echo "")
          existing_apk=$(gh release view "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --json assets \
            --jq '.assets[] | select(.name | endswith(".apk")) | .name' \
            2>/dev/null || echo "")
          if [ -n "$existing_aab" ] && [ -n "$existing_apk" ]; then
            echo "skip_attach=true" >> "$GITHUB_OUTPUT"
            echo "Release artifacts already attached; skipping re-upload."
          else
            echo "skip_attach=false" >> "$GITHUB_OUTPUT"
            echo "Release artifacts not yet attached; will upload."
          fi

      - name: Attach AAB and APK to GitHub Release
        if: steps.check-existing.outputs.skip_attach != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: false
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          files: |
            ${{ steps.locate.outputs.aab }}
            ${{ steps.locate.outputs.apk }}

      - name: Determine if this is a pre-release tag
        id: prerelease
        run: |
          tag="${{ github.ref_name }}"
          if [[ "$tag" == *-rc* || "$tag" == *-beta* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload AAB to Play Console internal track
        if: steps.prerelease.outputs.is_prerelease != 'true'
        env:
          PLAY_SUPPLY_JSON_KEY: ${{ secrets.PLAY_SUPPLY_JSON_KEY }}
        run: |
          set -euo pipefail
          echo "$PLAY_SUPPLY_JSON_KEY" > fastlane/play-supply-credentials.json
          chmod 600 fastlane/play-supply-credentials.json
          bundle exec fastlane play_upload
          rm -f fastlane/play-supply-credentials.json
          echo "Uploaded to Play Console internal track."

      - name: Skip Play Console upload for pre-release tag
        if: steps.prerelease.outputs.is_prerelease == 'true'
        run: |
          tag="${{ github.ref_name }}"
          echo "Tag $tag matches a pre-release pattern (rc/beta); skipping Play Console upload."
