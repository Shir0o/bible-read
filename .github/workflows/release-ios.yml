name: Release iOS

# Triggered when release-please pushes a version tag (e.g. v1.25.0)
# or dispatched manually to retry/rebuild against an existing tag.
# Builds a signed IPA carrying the tag-derived build number,
# uploads the IPA to TestFlight via fastlane, and attaches the IPA
# to the GitHub Release.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and submit, e.g. v1.25.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-publish-ios:
    name: Build IPA, attach, and upload to TestFlight
    runs-on: macos-15
    timeout-minutes: 60
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout repository at tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - name: Verify all iOS release secrets are present
        id: check-secrets
        env:
          IOS_DISTRIBUTION_CERT_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERT_BASE64 }}
          IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          missing=()
          for var in IOS_DISTRIBUTION_CERT_BASE64 IOS_CERT_PASSWORD IOS_PROVISIONING_PROFILE_BASE64 ASC_API_KEY_P8_BASE64 ASC_KEY_ID ASC_ISSUER_ID; do
            if [ -z "${!var:-}" ]; then
              missing+=("$var")
            fi
          done
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing required iOS GitHub secrets: ${missing[*]}"
            echo "::error::See RELEASING.md for setup instructions."
            exit 1
          fi
          echo "All iOS release secrets present."

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Setup Ruby + Bundler for fastlane
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: '3.2'
          bundler-cache: false

      - name: Install Ruby dependencies
        run: bundle install

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Derive version code from tag
        id: version
        run: |
          set -euo pipefail
          tag="$TAG"
          echo "Deriving version code for tag: $tag"
          code=$(dart tool/version_code.dart "$tag")
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Derived version code: $code"

      - name: Check for pre-release tag
        id: prerelease
        run: |
          set -euo pipefail
          tag="$TAG"
          if [[ "$tag" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+-(rc|beta|alpha) ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "Tag $tag is a pre-release."
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            echo "Tag $tag is a production release."
          fi

      - name: Install signing certificate and provisioning profile
        env:
          IOS_DISTRIBUTION_CERT_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERT_BASE64 }}
          IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: "ci-temporary-keychain-password"
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # Include system keychains in user search list so system roots are accessible
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"') /Library/Keychains/System.keychain /System/Library/Keychains/SystemRootCertificates.keychain
          security default-keychain -s "$KEYCHAIN_PATH"

          # Download and install Apple Worldwide Developer Relations intermediate certificates (G3 and G6)
          curl -sS https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer > "$RUNNER_TEMP/AppleWWDRCAG3.cer"
          security import "$RUNNER_TEMP/AppleWWDRCAG3.cer" -k "$KEYCHAIN_PATH" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/AppleWWDRCAG3.cer"

          curl -sS https://www.apple.com/certificateauthority/AppleWWDRCAG6.cer > "$RUNNER_TEMP/AppleWWDRCAG6.cer"
          security import "$RUNNER_TEMP/AppleWWDRCAG6.cer" -k "$KEYCHAIN_PATH" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/AppleWWDRCAG6.cer"

          # Also import Apple Root CA to ensure root chain evaluates cleanly
          security find-certificate -a -c "Apple Root CA" -p /System/Library/Keychains/SystemRootCertificates.keychain > "$RUNNER_TEMP/AppleRoots.pem" 2>/dev/null || true
          if [ -s "$RUNNER_TEMP/AppleRoots.pem" ]; then
            security import "$RUNNER_TEMP/AppleRoots.pem" -k "$KEYCHAIN_PATH" -T /usr/bin/codesign -T /usr/bin/security || true
            rm -f "$RUNNER_TEMP/AppleRoots.pem"
          fi

          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 -d > "$RUNNER_TEMP/profile.mobileprovision"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< $(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision"))
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print Name" /dev/stdin <<< $(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision"))
          cp "$RUNNER_TEMP/profile.mobileprovision" "$PROFILE_DIR/${PROFILE_UUID}.mobileprovision"

          # Extract DeveloperCertificates from the provisioning profile and import into keychain to guarantee pairing with private key
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          cert_count=$(/usr/libexec/PlistBuddy -c "Print DeveloperCertificates" "$RUNNER_TEMP/profile.plist" 2>/dev/null | grep -c "Array {" || true)
          # PlistBuddy array entries can be iterated
          idx=0
          while /usr/libexec/PlistBuddy -c "Print DeveloperCertificates:$idx" "$RUNNER_TEMP/profile.plist" > "$RUNNER_TEMP/cert_$idx.der" 2>/dev/null; do
            security import "$RUNNER_TEMP/cert_$idx.der" -k "$KEYCHAIN_PATH" -T /usr/bin/codesign -T /usr/bin/security || true
            rm -f "$RUNNER_TEMP/cert_$idx.der"
            idx=$((idx + 1))
          done
          rm -f "$RUNNER_TEMP/profile.plist"

          CERT_PATH="$RUNNER_TEMP/distribution.p12"
          echo "$IOS_DISTRIBUTION_CERT_BASE64" | base64 -d > "$CERT_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$IOS_CERT_PASSWORD" -A -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" || true

          echo "Available valid code signing identities in keychain:"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

          rm -f "$RUNNER_TEMP/profile.mobileprovision" "$CERT_PATH"

          # Create ExportOptions.plist for app-store distribution with the profile UUID
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>4DP58Y67SQ</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.bibleread.challenge</key>
              <string>${PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          EOF

          # Configure Flutter release xcconfig overrides for manual distribution signing
          cat >> ios/Flutter/Release.xcconfig <<EOF
          CODE_SIGN_STYLE = Manual
          DEVELOPMENT_TEAM = 4DP58Y67SQ
          PROVISIONING_PROFILE_SPECIFIER = ${PROFILE_NAME}
          PROVISIONING_PROFILE = ${PROFILE_UUID}
          CODE_SIGN_IDENTITY = Apple Distribution
          CODE_SIGN_IDENTITY[sdk=iphoneos*] = Apple Distribution
          EOF

          echo "Provisioning profile (${PROFILE_NAME} / ${PROFILE_UUID}) and distribution certificate installed."

      - name: Materialize App Store Connect API key
        env:
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          echo "$ASC_API_KEY_P8_BASE64" | base64 -d > fastlane/asc-api-key.p8
          chmod 600 fastlane/asc-api-key.p8
          echo "asc-api-key.p8 materialized."

      - name: Build signed iOS IPA
        env:
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail
          flutter build ipa --release --build-number="$VERSION_CODE" --export-options-plist="$RUNNER_TEMP/ExportOptions.plist"


      - name: Extract changelog for TestFlight notes
        id: notes
        run: |
          set -euo pipefail
          tag="$TAG"
          ruby -e '
            tag = ENV["TAG"] || ""
            changelog = File.exist?("CHANGELOG.md") ? File.read("CHANGELOG.md") : ""
            ver = tag.sub(/^v/, "").split("-").first || ""

            pattern = if !ver.empty?
              /^##\s+\[?v?#{Regexp.escape(ver)}\]?[^\n]*\n(.*?)(?=^##\s+\[?v?[0-9]|\Z)/m
            else
              /^##\s+\[?v?[0-9]+\.[0-9]+\.[0-9]+[^\]\n]*\]?[^\n]*\n(.*?)(?=^##\s+\[?v?[0-9]|\Z)/m
            end

            match = changelog.match(pattern)
            body = match ? match[1].strip : ""

            cleaned = body.gsub(/\s*\(\[[^\]]+\]\([^)]+\)\)/, "")
            cleaned = cleaned.gsub(/\[([^\]]+)\]\([^)]+\)/, "\\1")
            cleaned = cleaned.gsub(/\*\*([^*]+)\*\*/, "\\1")
            cleaned = cleaned.gsub(/\*([^*]+)\*/, "\\1")
            cleaned = cleaned.gsub(/^###?\s+(.+)$/, "\\1:")
            cleaned = cleaned.gsub(/^\s*[\*\-]\s+/, "\u2022 ")
            cleaned = cleaned.lines.map(&:rstrip).join("\n")
            cleaned = cleaned.gsub(/\n{3,}/, "\n\n").strip

            if cleaned.length > 4000
              cleaned = cleaned[0...3997] + "..."
            end

            if cleaned.empty?
              cleaned = "Bug fixes and improvements."
            end

            File.write("testflight-notes.txt", cleaned)
          '
          echo "Generated testflight-notes.txt"

      - name: Upload IPA to TestFlight
        if: steps.prerelease.outputs.is_prerelease != 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          CHANGELOG_TEXT=$(cat testflight-notes.txt)
          export CHANGELOG_TEXT
          bundle exec fastlane ios testflight_upload
          echo "Uploaded IPA to TestFlight."

      - name: Attach IPA to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="$TAG"
          ipa_file=$(find build/ios/ipa -name "*.ipa" | head -n 1)
          if [ -n "$ipa_file" ] && [ -f "$ipa_file" ]; then
            dest_name="bible_read-$tag.ipa"
            cp "$ipa_file" "$dest_name"
            gh release upload "$tag" "$dest_name" --clobber
            rm -f "$dest_name"
            echo "Uploaded $dest_name to GitHub Release $tag."
          else
            echo "::warning::No IPA found in build/ios/ipa to attach to release."
          fi

      - name: Remove mounted credentials and temporary keychain
        if: always()
        continue-on-error: true
        run: |
          rm -f fastlane/asc-api-key.p8
          rm -f testflight-notes.txt
          rm -f "$RUNNER_TEMP/ExportOptions.plist"
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision
          git checkout -- ios/Flutter/Release.xcconfig 2>/dev/null || true
          if [ -f "$RUNNER_TEMP/build.keychain" ]; then
            security delete-keychain "$RUNNER_TEMP/build.keychain" || true
          fi
