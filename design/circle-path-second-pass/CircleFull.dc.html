<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #6A53AD; } a:hover { color: #5B449E; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #F4F0E8; color: #231E2C; font-family: 'Hanken Grotesk', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <div style="height: 44px; flex-shrink: 0"></div>

  <div style="flex-shrink: 0; padding: 10px 16px 16px">
    <div style="font-size: 11px; font-weight: 700; letter-spacing: 1.6px; text-transform: uppercase; color: #6C6577">Together</div>
    <div style="font-family: Spectral, Georgia, serif; font-size: 24px; font-weight: 500; letter-spacing: -0.3px; margin-top: 4px">Circle</div>
  </div>

  <div style="flex-shrink: 0; display: flex; gap: 8px; padding: 0 16px 16px; overflow: hidden">
    <div style="height: 36px; padding: 0 14px; border-radius: 12px; background: rgba(106,83,173,0.10); border: 1px solid rgba(106,83,173,0.26); color: #6A53AD; font-size: 12.5px; font-weight: 600; letter-spacing: 0.2px; display: flex; align-items: center">Everyone</div>
    <div style="height: 36px; padding: 0 14px; border-radius: 12px; background: #FFFDFA; border: 1px solid #EDEAEA; color: #6C6577; font-size: 12.5px; font-weight: 600; letter-spacing: 0.2px; display: flex; align-items: center">Morning Crew</div>
    <div style="height: 36px; padding: 0 14px; border-radius: 12px; background: #FFFDFA; border: 1px solid #EDEAEA; color: #6C6577; font-size: 12.5px; font-weight: 600; letter-spacing: 0.2px; display: flex; align-items: center">Sunday Group</div>
  </div>

  <div style="flex: 1; padding: 0 16px; overflow: hidden">
    <div style="background: #F5F1E9; border: 1px solid #EDEAEA; border-radius: 16px; display: flex; flex-direction: column">

      <div style="display: flex; align-items: center; gap: 12px; padding: 11px 14px">
        <div style="width: 38px; height: 38px; flex-shrink: 0; border-radius: 19px; background: #E3DBCC; border: 2px solid #6A53AD; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600; color: #6C6577">T</div>
        <div style="flex-grow: 1; min-width: 0">
          <div style="font-size: 15px; font-weight: 600">You</div>
          <div style="font-size: 11px; font-weight: 700; letter-spacing: 1.6px; color: #6A53AD; margin-top: 1px">Genesis 12–14</div>
        </div>
      </div>

      <div style="height: 1px; background: rgba(43,33,58,0.085)"></div>

      <div style="display: flex; align-items: center; gap: 12px; padding: 11px 14px">
        <div style="width: 38px; height: 38px; flex-shrink: 0; border-radius: 19px; background: #E3DBCC; border: 1px solid #EDEAEA; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600; color: #6C6577">M</div>
        <div style="flex-grow: 1; min-width: 0">
          <div style="font-size: 15px; font-weight: 600">Mei</div>
          <div style="font-size: 11px; font-weight: 700; letter-spacing: 1.6px; color: #6C6577; margin-top: 1px">Not yet today</div>
        </div>
        <div style="flex-shrink: 0; height: 32px; padding: 0 12px; border-radius: 14px; background: rgba(190,138,82,0.14); color: #A0702F; font-size: 12.5px; font-weight: 600; letter-spacing: 0.2px; display: flex; align-items: center; gap: 6px">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#A0702F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 20 L12 11 M8.5 14 L12 10.5 L15.5 14 M5 5 L19 5"></path>
          </svg>
          Nudge
        </div>
      </div>

      <div style="height: 1px; background: rgba(43,33,58,0.085)"></div>

      <div style="display: flex; align-items: flex-start; gap: 12px; padding: 11px 14px">
        <div style="width: 38px; height: 38px; flex-shrink: 0; border-radius: 19px; background: #E3DBCC; border: 2px solid #6A53AD; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600; color: #6C6577">D</div>
        <div style="flex-grow: 1; min-width: 0">
          <div style="display: flex; align-items: center; gap: 8px">
            <span style="font-size: 15px; font-weight: 600">Daniel</span>
            <span style="height: 20px; padding: 0 8px; border-radius: 10px; background: rgba(190,138,82,0.14); color: #A0702F; font-size: 11px; font-weight: 700; letter-spacing: 0.2px; display: inline-flex; align-items: center; gap: 4px">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#A0702F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 3 L14.6 8.6 L20.5 9.4 L16.2 13.6 L17.3 19.6 L12 16.8 L6.7 19.6 L7.8 13.6 L3.5 9.4 L9.4 8.6 Z"></path>
              </svg>
              New Testament
            </span>
          </div>
          <div style="font-size: 11px; font-weight: 700; letter-spacing: 1.6px; color: #6A53AD; margin-top: 1px">Genesis 12–14</div>
          <sc-if value="{{showReflection}}" hint-placeholder-val="{{ true }}">
            <div style="font-family: Spectral, Georgia, serif; font-size: 13px; line-height: 1.4; color: #231E2C; margin-top: 6px">Abram just goes. No argument, no map. I have been waiting for a map.</div>
          </sc-if>
        </div>
      </div>

      <div style="height: 1px; background: rgba(43,33,58,0.085)"></div>

      <div style="display: flex; align-items: center; gap: 12px; padding: 11px 14px">
        <div style="width: 38px; height: 38px; flex-shrink: 0; border-radius: 19px; background: #E3DBCC; border: 2px solid #6A53AD; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600; color: #6C6577">P</div>
        <div style="flex-grow: 1; min-width: 0">
          <div style="font-size: 15px; font-weight: 600">Priya</div>
          <div style="font-size: 11px; font-weight: 700; letter-spacing: 1.6px; color: #6A53AD; margin-top: 1px">Showed up · 2 readings behind</div>
        </div>
      </div>

      <div style="height: 1px; background: rgba(43,33,58,0.085)"></div>

      <div style="display: flex; align-items: center; gap: 12px; padding: 11px 14px">
        <div style="width: 38px; height: 38px; flex-shrink: 0; border-radius: 19px; background: #E3DBCC; border: 2px solid #6A53AD; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600; color: #6C6577">S</div>
        <div style="flex-grow: 1; min-width: 0">
          <div style="font-size: 15px; font-weight: 600">Sam</div>
          <div style="font-size: 11px; font-weight: 700; letter-spacing: 1.6px; color: #6A53AD; margin-top: 1px">Showed up</div>
        </div>
      </div>

    </div>
  </div>

  <div style="flex-shrink: 0; height: 80px; background: #EFEAE0; border-top: 1px solid rgba(43,33,58,0.085); display: flex; align-items: center; justify-content: space-around; padding: 0 8px">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; width: 88px">
      <div style="width: 64px; height: 32px; border-radius: 16px; display: flex; align-items: center; justify-content: center">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#6C6577" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4.2"></circle>
          <path d="M19.2 12 L21.6 12 M17.09 17.09 L18.79 18.79 M12 19.2 L12 21.6 M6.91 17.09 L5.21 18.79 M4.8 12 L2.4 12 M6.91 6.91 L5.21 5.21 M12 4.8 L12 2.4 M17.09 6.91 L18.79 5.21"></path>
        </svg>
      </div>
      <span style="font-size: 12.5px; font-weight: 600; letter-spacing: 0.2px; color: #6C6577">Today</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; width: 88px">
      <div style="width: 64px; height: 32px; border-radius: 16px; background: rgba(106,83,173,0.10); display: flex; align-items: center; justify-content: center">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#6A53AD" stroke-width="1.8">
          <circle cx="12" cy="12" r="7.6"></circle>
          <circle cx="12" cy="4.4" r="2.1" fill="#6A53AD" stroke="none"></circle>
          <circle cx="5.42" cy="15.8" r="2.1" fill="#6A53AD" stroke="none"></circle>
          <circle cx="18.58" cy="15.8" r="2.1" fill="#6A53AD" stroke="none"></circle>
        </svg>
      </div>
      <span style="font-size: 12.5px; font-weight: 600; letter-spacing: 0.2px; color: #6A53AD">Circle</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; width: 88px">
      <div style="width: 64px; height: 32px; border-radius: 16px; display: flex; align-items: center; justify-content: center">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#6C6577" stroke-width="1.8" stroke-linecap="round">
          <circle cx="5.6" cy="18.4" r="2" fill="#6C6577" stroke="none"></circle>
          <path d="M7.6 18.4 C13.6 18.4 10.4 5.6 16.2 5.6"></path>
          <circle cx="18.4" cy="5.6" r="2.2"></circle>
        </svg>
      </div>
      <span style="font-size: 12.5px; font-weight: 600; letter-spacing: 0.2px; color: #6C6577">Path</span>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"reflections":{"editor":"boolean","default":true,"section":"Row content"}}'>
class Component extends DCLogic {
  renderVals() {
    return { showReflection: this.props.reflections ?? true };
  }
}
</script>
</body>
</html>
