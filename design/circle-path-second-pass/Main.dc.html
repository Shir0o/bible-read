<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #6A53AD; } a:hover { color: #5B449E; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #F4F0E8; color: #231E2C; font-family: 'Hanken Grotesk', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <div style="height: 44px; flex-shrink: 0"></div>

  <div style="flex-shrink: 0; padding: 10px 16px 16px">
    <div style="font-size: 11px; font-weight: 700; letter-spacing: 1.6px; text-transform: uppercase; color: #6C6577">Together</div>
    <div style="font-family: Spectral, Georgia, serif; font-size: 24px; font-weight: 500; letter-spacing: -0.3px; margin-top: 4px">Circle</div>
  </div>

  <div style="flex: 1; padding: 8px 16px 0; display: flex; flex-direction: column">
    <div style="background: #FFFDFA; border: 1px solid #EDEAEA; border-radius: 22px; padding: 32px 24px 24px; display: flex; flex-direction: column; align-items: center">

      <div style="width: 64px; height: 64px; border-radius: 32px; background: rgba(106,83,173,0.10); display: flex; align-items: center; justify-content: center">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#6A53AD" stroke-width="1.8">
          <circle cx="12" cy="12" r="7.6"></circle>
          <circle cx="12" cy="4.4" r="2.1" fill="#6A53AD" stroke="none"></circle>
          <circle cx="5.42" cy="15.8" r="2.1" fill="#6A53AD" stroke="none"></circle>
          <circle cx="18.58" cy="15.8" r="2.1" fill="#6A53AD" stroke="none"></circle>
        </svg>
      </div>

      <div style="font-family: Spectral, Georgia, serif; font-size: 22px; font-weight: 500; letter-spacing: -0.25px; margin-top: 18px">No one here yet</div>

      <div style="font-size: 14px; line-height: 1.45; color: #6C6577; text-align: center; text-wrap: pretty; margin-top: 8px; max-width: 250px">Your Circle is everyone you share a group with.</div>

      <div style="display: flex; flex-direction: column; gap: 10px; align-self: stretch; margin-top: 26px">
        <button style="height: 52px; border: none; border-radius: 16px; background: #6A53AD; color: #FFFFFF; font-family: 'Hanken Grotesk', system-ui, sans-serif; font-size: 15px; font-weight: 600; cursor: pointer">Have a code?</button>
        <button style="height: 52px; border: 1px solid rgba(106,83,173,0.26); border-radius: 16px; background: transparent; color: #6A53AD; font-family: 'Hanken Grotesk', system-ui, sans-serif; font-size: 15px; font-weight: 600; cursor: pointer">Find a group</button>
        <button style="height: 44px; border: none; border-radius: 16px; background: transparent; color: #6C6577; font-family: 'Hanken Grotesk', system-ui, sans-serif; font-size: 15px; font-weight: 600; cursor: pointer">Create a group</button>
      </div>

    </div>
  </div>

  <div style="flex-shrink: 0; height: 80px; background: #EFEAE0; border-top: 1px solid rgba(43,33,58,0.085); display: flex; align-items: center; justify-content: space-around; padding: 0 8px">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; width: 88px">
      <div style="width: 64px; height: 32px; border-radius: 16px; display: flex; align-items: center; justify-content: center">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#6C6577" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4.2"></circle>
          <path d="M19.2 12 L21.6 12 M17.09 17.09 L18.79 18.79 M12 19.2 L12 21.6 M6.91 17.09 L5.21 18.79 M4.8 12 L2.4 12 M6.91 6.91 L5.21 5.21 M12 4.8 L12 2.4 M17.09 6.91 L18.79 5.21"></path>
        </svg>
      </div>
      <span style="font-size: 12.5px; font-weight: 600; letter-spacing: 0.2px; color: #6C6577">Today</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; width: 88px">
      <div style="width: 64px; height: 32px; border-radius: 16px; background: rgba(106,83,173,0.10); display: flex; align-items: center; justify-content: center">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#6A53AD" stroke-width="1.8">
          <circle cx="12" cy="12" r="7.6"></circle>
          <circle cx="12" cy="4.4" r="2.1" fill="#6A53AD" stroke="none"></circle>
          <circle cx="5.42" cy="15.8" r="2.1" fill="#6A53AD" stroke="none"></circle>
          <circle cx="18.58" cy="15.8" r="2.1" fill="#6A53AD" stroke="none"></circle>
        </svg>
      </div>
      <span style="font-size: 12.5px; font-weight: 600; letter-spacing: 0.2px; color: #6A53AD">Circle</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; width: 88px">
      <div style="width: 64px; height: 32px; border-radius: 16px; display: flex; align-items: center; justify-content: center">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#6C6577" stroke-width="1.8" stroke-linecap="round">
          <circle cx="5.6" cy="18.4" r="2" fill="#6C6577" stroke="none"></circle>
          <path d="M7.6 18.4 C13.6 18.4 10.4 5.6 16.2 5.6"></path>
          <circle cx="18.4" cy="5.6" r="2.2"></circle>
        </svg>
      </div>
      <span style="font-size: 12.5px; font-weight: 600; letter-spacing: 0.2px; color: #6C6577">Path</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
