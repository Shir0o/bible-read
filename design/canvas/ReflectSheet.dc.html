<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
  <style>
    :root{
      --bg:#F4F0E8; --surface:#FFFDFA; --surface2:#F5F1E9; --surface3:#E9E2D5; --bg2:#EDE7DC;
      --text:#231E2C; --dim:#6C6577; --faint:#8C8694;
      --primary:#6A53AD; --psoft:rgba(106,83,173,0.10); --pline:rgba(106,83,173,0.26); --ppress:#5B449E;
      --accent:#A0702F; --asoft:rgba(190,138,82,0.14);
      --border:rgba(43,33,58,0.085); --bstrong:rgba(43,33,58,0.15);
      --serif:'Spectral',Georgia,'Times New Roman',serif;
      --sans:'Hanken Grotesk','Helvetica Neue',Arial,sans-serif;
    }
    *{box-sizing:border-box;}
    body{margin:0;background:#F4F0E8;color:#231E2C;font-family:var(--sans);-webkit-font-smoothing:antialiased;text-wrap:pretty;}
    a{color:#6A53AD;text-decoration:none;} a:hover{color:#5B449E;}
  </style>
</helmet>
<div style="width:390px;height:844px;background:#F4F0E8;display:flex;flex-direction:column;overflow:hidden;font-family:var(--sans);color:#231E2C">
<div style="padding:24px 16px 16px;display:flex;align-items:center;gap:10px;flex:0 0 auto">
  <div style="flex:1 1 auto;display:flex;flex-direction:column;gap:4px;min-width:0">
    <div style="font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:1.6px;color:rgba(108,101,119,0.7)">TODAY</div>
    <div style="font-family:var(--serif);font-size:27px;font-weight:500;letter-spacing:-0.27px;line-height:1.05;color:#231E2C">Wednesday</div>
  </div>
  <div style="display:flex;align-items:center;gap:8px;flex:0 0 auto"><div style="width:40px;height:40px;border-radius:999px;background:rgba(106,83,173,0.10);border:1px solid rgba(106,83,173,0.26);display:flex;align-items:center;justify-content:center;font-family:var(--sans);font-size:15px;font-weight:600;color:#6A53AD">T</div></div>
</div><div style="flex:1 1 auto;position:relative;background:#F4F0E8;overflow:hidden">
  <div style="position:absolute;inset:0;padding:24px 16px;opacity:0.5"><div style="font-family:var(--serif);font-size:27px;font-weight:500;color:#231E2C">Wednesday</div></div>
  <div style="position:absolute;inset:0;background:rgba(10,8,14,0.42)"></div>
  <div style="position:absolute;left:0;right:0;bottom:0;background:#FFFDFA;border-radius:26px 26px 0 0;padding:10px 20px 24px;display:flex;flex-direction:column;gap:14px">
    <div style="width:38px;height:4px;border-radius:999px;background:rgba(43,33,58,0.15);align-self:center;margin-bottom:4px"></div>
    
  <div style="display:flex;flex-direction:column;gap:4px">
    <div style="font-family:var(--serif);font-size:21px;font-weight:500;letter-spacing:-0.25px;color:#231E2C">Today&rsquo;s reflection</div>
    <div style="font-family:var(--sans);font-size:13.5px;color:#6C6577">Genesis 14 &middot; what stayed with you?</div>
  </div>
  <div style="min-height:118px;border-radius:18px;background:#F5F1E9;border:1px solid rgba(43,33,58,0.085);padding:14px 15px;font-family:var(--serif);font-size:15px;line-height:1.6;color:#231E2C">Abram gave a tenth of everything, before there was any law telling him to.</div>
  <div style="background:#FFFDFA;border:1px solid rgba(43,33,58,0.085);border-radius:18px;padding:14px 15px;display:flex;align-items:center;gap:14px">
    <div style="flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px">
      <div style="font-family:var(--sans);font-size:15px;font-weight:600;color:#231E2C">Share with your circle</div>
      <div style="font-family:var(--sans);font-size:13px;color:#6C6577">Off &mdash; only you can read this.</div>
    </div>
    <div style="width:50px;height:30px;border-radius:999px;background:#E9E2D5;flex:0 0 auto;display:flex;align-items:center;padding:3px">
      <div style="width:24px;height:24px;border-radius:999px;background:#FFFDFA;border:1px solid rgba(43,33,58,0.085)"></div>
    </div>
  </div>
  <div style="height:52px;border-radius:16px;background:#6A53AD;color:#FFFFFF;border:none;display:flex;align-items:center;justify-content:center;gap:8px;font-family:var(--sans);font-size:15px;font-weight:600">Save</div>
  <div style="height:44px;display:flex;align-items:center;justify-content:center;font-family:var(--sans);font-size:15px;font-weight:600;color:#6C6577">Skip today</div>
  </div>
</div>
</div>
</x-dc>
</body>
</html>
