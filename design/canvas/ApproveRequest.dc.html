<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
  <style>
    :root{
      --bg:#F4F0E8; --surface:#FFFDFA; --surface2:#F5F1E9; --surface3:#E9E2D5; --bg2:#EDE7DC;
      --text:#231E2C; --dim:#6C6577; --faint:#8C8694;
      --primary:#6A53AD; --psoft:rgba(106,83,173,0.10); --pline:rgba(106,83,173,0.26); --ppress:#5B449E;
      --accent:#A0702F; --asoft:rgba(190,138,82,0.14);
      --border:rgba(43,33,58,0.085); --bstrong:rgba(43,33,58,0.15);
      --serif:'Spectral',Georgia,'Times New Roman',serif;
      --sans:'Hanken Grotesk','Helvetica Neue',Arial,sans-serif;
    }
    *{box-sizing:border-box;}
    body{margin:0;background:#F4F0E8;color:#231E2C;font-family:var(--sans);-webkit-font-smoothing:antialiased;text-wrap:pretty;}
    a{color:#6A53AD;text-decoration:none;} a:hover{color:#5B449E;}
  </style>
</helmet>
<div style="width:390px;height:844px;background:#F4F0E8;display:flex;flex-direction:column;overflow:hidden;font-family:var(--sans);color:#231E2C">
<div style="padding:22px 16px 14px;display:flex;align-items:center;gap:12px;flex:0 0 auto">
  <div style="width:40px;height:40px;border-radius:999px;background:#FFFDFA;border:1px solid rgba(43,33,58,0.085);display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#231E2C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg></div>
  <div style="font-family:var(--serif);font-size:22px;font-weight:500;letter-spacing:-0.25px;color:#231E2C">Join request</div>
</div>
<div style="flex:1 1 auto;overflow:hidden;padding:6px 16px 0;display:flex;flex-direction:column;gap:14px">
  <div style="background:#FFFDFA;border:1px solid rgba(43,33,58,0.085);border-radius:22px;padding:18px"><div style="display:flex;align-items:center;gap:14px">
    <div style="width:52px;height:52px;border-radius:999px;background:rgba(106,83,173,0.10);border:1px solid rgba(106,83,173,0.26);display:flex;align-items:center;justify-content:center;flex:0 0 auto;font-family:var(--sans);font-size:20px;font-weight:600;color:#6A53AD">A</div>
    <div style="flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:3px">
      <div style="font-family:var(--sans);font-size:17px;font-weight:600;color:#231E2C">Ana Duarte</div>
      <div style="font-family:var(--sans);font-size:13.5px;color:#6C6577">Asked to join Morning Psalms</div>
    </div>
  </div></div>
  <div style="background:rgba(190,138,82,0.14);border-radius:18px;padding:16px;display:flex;gap:12px">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#A0702F" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2.8 12S6.5 5.8 12 5.8 21.2 12 21.2 12 17.5 18.2 12 18.2 2.8 12 2.8 12Z"/><circle cx="12" cy="12" r="2.6"/></svg>
    <div style="flex:1 1 auto;font-family:var(--sans);font-size:14px;line-height:1.5;color:#231E2C">If you approve, Ana will see what <b style="font-weight:600">everyone in this group</b> has read &mdash; not only your own reading &mdash; and can send them encouragement.</div>
  </div>
  <div style="height:52px;border-radius:16px;background:#6A53AD;color:#FFFFFF;border:none;display:flex;align-items:center;justify-content:center;gap:8px;font-family:var(--sans);font-size:15px;font-weight:600">Approve</div>
  <div style="height:52px;border-radius:16px;background:transparent;color:#231E2C;border:1px solid rgba(43,33,58,0.15);display:flex;align-items:center;justify-content:center;gap:8px;font-family:var(--sans);font-size:15px;font-weight:600">Decline</div>
  <div style="font-family:var(--sans);font-size:12.5px;color:#8C8694;text-align:center">You can remove a member at any time.</div>
</div>
</div>
</x-dc>
</body>
</html>
