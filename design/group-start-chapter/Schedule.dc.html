<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Spectral:wght@400;500;600&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Hanken Grotesk', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #6A53AD; text-decoration: none; }
    a:hover { color: #5B449E; }
    button { font-family: inherit; border: 0; background: none; padding: 0; cursor: pointer; color: inherit; }
    .sc { scrollbar-width: none; }
    .sc::-webkit-scrollbar { width: 0; height: 0; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #F4F0E8; color: #231E2C; display: flex; flex-direction: column; overflow: hidden">

  <!-- SubHeader -->
  <div style="display: flex; align-items: center; gap: 2px; padding: 10px 14px 8px 14px; flex-shrink: 0">
    <button style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 16px">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#231E2C" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
    </button>
    <div style="flex-grow: 1; font-family: Spectral, Georgia, serif; font-size: 24px; font-weight: 500; letter-spacing: -0.2px">Adjust days</div>
    <button onClick="{{reset}}" style="{{resetStyle}}">Even it out</button>
  </div>

  <!-- Summary -->
  <div style="flex-shrink: 0; padding: 4px 20px 14px 20px; display: flex; flex-direction: column; gap: 8px">
    <div style="font-size: 13px; color: #6C6577; line-height: 1.45">Set what any one day holds. The days after it shift to keep the reading in order.</div>
    <div style="display: flex; gap: 8px">
      <div style="flex-grow: 1; background: #FFFDFA; border: 1px solid rgba(43,33,58,0.085); border-radius: 16px; padding: 10px 12px; display: flex; flex-direction: column; gap: 1px">
        <div style="font-family: Spectral, Georgia, serif; font-size: 20px; font-weight: 500">{{totalChapters}}</div>
        <div style="font-size: 11px; font-weight: 700; letter-spacing: 1.6px; color: #8C8694">CHAPTERS</div>
      </div>
      <div style="flex-grow: 1; background: #FFFDFA; border: 1px solid rgba(43,33,58,0.085); border-radius: 16px; padding: 10px 12px; display: flex; flex-direction: column; gap: 1px">
        <div style="font-family: Spectral, Georgia, serif; font-size: 20px; font-weight: 500">{{totalDays}}</div>
        <div style="font-size: 11px; font-weight: 700; letter-spacing: 1.6px; color: #8C8694">DAYS</div>
      </div>
      <div style="flex-grow: 1; background: #FFFDFA; border: 1px solid rgba(43,33,58,0.085); border-radius: 16px; padding: 10px 12px; display: flex; flex-direction: column; gap: 1px">
        <div style="font-family: Spectral, Georgia, serif; font-size: 20px; font-weight: 500">{{endShort}}</div>
        <div style="font-size: 11px; font-weight: 700; letter-spacing: 1.6px; color: #8C8694">FINISHES</div>
      </div>
    </div>
  </div>

  <!-- Day list -->
  <div class="sc" style="flex-grow: 1; overflow-y: auto; padding: 0 20px 20px 20px">
    <div style="background: #FFFDFA; border: 1px solid rgba(43,33,58,0.085); border-radius: 22px; overflow: hidden">
      <sc-for list="{{days}}" as="d" hint-placeholder-count="8">
        <div style="{{d.rowStyle}}">
          <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0">
            <div style="display: flex; align-items: center; gap: 7px">
              <span style="font-size: 11px; font-weight: 700; letter-spacing: 1.6px; color: #8C8694">DAY {{d.n}}</span>
              <span style="font-size: 12.5px; color: #6C6577">{{d.date}}</span>
              <sc-if value="{{d.edited}}" hint-placeholder-val="{{false}}">
                <span style="font-size: 10.5px; font-weight: 700; letter-spacing: 0.6px; color: #6E4D20; background: rgba(190,138,82,0.14); border-radius: 12px; padding: 2px 7px">SET</span>
              </sc-if>
            </div>
            <div style="font-family: Spectral, Georgia, serif; font-size: 17px; font-weight: 500; letter-spacing: -0.2px; line-height: 1.3; color: #231E2C">{{d.ref}}</div>
          </div>

          <div style="display: flex; align-items: center; background: #F5F1E9; border: 1px solid rgba(43,33,58,0.085); border-radius: 16px; padding: 2px; flex-shrink: 0">
            <button onClick="{{d.dec}}" aria-label="One chapter fewer" style="{{d.decStyle}}">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14"></path></svg>
            </button>
            <div style="min-width: 22px; text-align: center; font-family: Spectral, Georgia, serif; font-size: 17px; font-weight: 500; color: #231E2C">{{d.count}}</div>
            <button onClick="{{d.inc}}" aria-label="One chapter more" style="{{d.incStyle}}">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
            </button>
          </div>
        </div>
      </sc-for>

      <div style="padding: 13px 16px; background: #F5F1E9; font-size: 13px; color: #6C6577; text-align: center; border-top: 1px solid rgba(43,33,58,0.085)">{{tailNote}}</div>
    </div>
  </div>

  <!-- Footer -->
  <div style="flex-shrink: 0; padding: 12px 20px 20px 20px; background: #F4F0E8; border-top: 1px solid rgba(43,33,58,0.085)">
    <button style="width: 100%; height: 52px; border-radius: 16px; background: #6A53AD; color: #FFFFFF; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center">Save schedule</button>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const BOOKS = [
  { name: 'Isaiah', n: 66 },
  { name: 'Jeremiah', n: 52 },
  { name: 'Lamentations', n: 5 },
];
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const START_BOOK = 'Jeremiah';
const START_CH = 1;
const PER_DAY = 2;
const SHOWN = 8;
const DASH = '–';
const DOT = '·';

class Component extends DCLogic {
  constructor(props) {
    super(props);
    // Day 1 held to a single chapter, day 2 to two — the split the reader wanted.
    this.state = { edits: { 0: 1, 1: 2 } };
  }

  chapterList() {
    const out = [];
    let on = false;
    for (const b of BOOKS) {
      for (let c = 1; c <= b.n; c++) {
        if (b.name === START_BOOK && c === START_CH) on = true;
        if (on) out.push({ book: b.name, ch: c });
      }
    }
    return out;
  }

  /** Lays chapters out day by day, honouring hand-set counts and book starts. */
  build(list, edits) {
    const out = [];
    let i = 0;
    let day = 0;
    while (i < list.length && day < 2000) {
      const left = list.length - i;
      const wanted = edits[day] != null ? edits[day] : PER_DAY;
      let take = Math.min(wanted, left);
      // A day never ends one book and begins the next.
      const book = list[i].book;
      let k = 0;
      while (k < take && list[i + k].book === book) k++;
      take = Math.max(1, k);
      out.push({ items: list.slice(i, i + take), edited: edits[day] != null });
      i += take;
      day++;
    }
    return out;
  }

  label(group) {
    const runs = [];
    for (const c of group) {
      const last = runs[runs.length - 1];
      if (last && last.book === c.book) last.end = c.ch;
      else runs.push({ book: c.book, start: c.ch, end: c.ch });
    }
    return runs
      .map((r) => (r.start === r.end ? r.book + ' ' + r.start : r.book + ' ' + r.start + DASH + r.end))
      .join(' ' + DOT + ' ');
  }

  dates(count) {
    const out = [];
    const d = new Date(2026, 8, 1);
    for (let i = 0; i < count; i++) {
      out.push(new Date(d));
      d.setDate(d.getDate() + 1);
    }
    return out;
  }

  step(index, delta, current) {
    const edits = Object.assign({}, this.state.edits);
    const next = Math.max(1, Math.min(20, current + delta));
    edits[index] = next;
    this.setState({ edits });
  }

  renderVals() {
    const list = this.chapterList();
    const groups = this.build(list, this.state.edits);
    const dates = this.dates(groups.length);
    const last = dates[dates.length - 1];

    const btn = 'width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 12px;';
    const days = groups.slice(0, SHOWN).map((g, i) => {
      const count = g.items.length;
      return {
        n: i + 1,
        date: DOW[dates[i].getDay()] + ', ' + MONTHS[dates[i].getMonth()] + ' ' + dates[i].getDate(),
        ref: this.label(g.items),
        count,
        edited: g.edited,
        rowStyle:
          'display: flex; align-items: center; gap: 12px; padding: 13px 14px 13px 16px;' +
          (i > 0 ? ' border-top: 1px solid rgba(43,33,58,0.085);' : ''),
        decStyle: btn + (count <= 1 ? ' color: #8C8694; opacity: 0.45;' : ' color: #5B449E;'),
        incStyle: btn + ' color: #5B449E;',
        dec: count <= 1 ? () => {} : () => this.step(i, -1, count),
        inc: () => this.step(i, 1, count),
      };
    });

    const rest = Math.max(0, groups.length - SHOWN);
    const edited = Object.keys(this.state.edits).length;

    return {
      days,
      totalChapters: list.length,
      totalDays: groups.length,
      endShort: MONTHS[last.getMonth()] + ' ' + last.getDate(),
      tailNote: rest > 0
        ? rest + ' more days ' + DOT + ' finishes ' + MONTHS[last.getMonth()] + ' ' + last.getDate()
        : 'That is the whole plan.',
      resetStyle:
        'height: 44px; padding: 0 12px; border-radius: 12px; font-size: 13px; font-weight: 600;' +
        (edited > 0 ? ' color: #5B449E;' : ' color: #8C8694; opacity: 0.45;'),
      reset: () => this.setState({ edits: {} }),
    };
  }
}
</script>
</body>
</html>
