<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@300;400;500;600&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: 'Hanken Grotesk', system-ui, -apple-system, sans-serif; }
    a { color: #6A53AD; } a:hover { color: #5B449E; }
  </style>
</helmet>
<div style="width: 480px; height: 1040px; overflow: hidden; background: #F4F0E8; position: relative; box-sizing: border-box;">

  <div style="padding: 80px 46px 0; display: flex; flex-direction: column; gap: 26px;">
    <div style="font-size: 11px; font-weight: 700; letter-spacing: 1.7px; color: #A0702F;">BIBLE READ</div>
    <div style="font-family: Spectral, Georgia, serif; font-size: 60px; font-weight: 400; line-height: 1.02; letter-spacing: -1.8px; color: #231E2C;">Reading<br>counts as<br><span style="font-style: italic; color: #6A53AD;">showing up.</span></div>
    <div style="width: 56px; height: 2px; background: #A0702F;"></div>
    <div style="font-size: 16px; line-height: 1.5; color: #6C6577; max-width: 300px; text-wrap: pretty;">A daily plan, a streak that tells the truth, and a group reading beside you.</div>
  </div>

  <div style="position: absolute; right: -66px; bottom: -104px; width: 268px; transform: rotate(-7deg); background: #231E2C; padding: 7px; border-radius: 38px; box-sizing: border-box; box-shadow: 0 34px 70px rgba(35, 30, 44, 0.28);">
    <div style="border-radius: 32px; overflow: hidden; height: 500px; background: #F4F0E8;">
      <div style="display: flex; flex-direction: column; gap: 11px; padding: 20px 13px; box-sizing: border-box;">

        <div style="display: flex; align-items: center; justify-content: space-between;">
          <div style="font-family: Spectral, Georgia, serif; font-size: 18px; font-weight: 500; letter-spacing: -0.3px; color: #231E2C;">Today</div>
          <div style="width: 26px; height: 26px; border-radius: 13px; background: #EAE3D6; border: 1px solid rgba(43, 33, 58, 0.09);"></div>
        </div>

        <div style="background: #FFFDFA; border: 1px solid rgba(43, 33, 58, 0.085); border-radius: 15px; padding: 13px; display: flex; flex-direction: column; gap: 10px;">
          <div style="font-size: 8.5px; font-weight: 700; letter-spacing: 1.2px; color: #8C8694;">DAY 14 OF 365</div>
          <div style="font-family: Spectral, Georgia, serif; font-size: 18px; font-weight: 500; letter-spacing: -0.3px; color: #231E2C;">Luke 9–10</div>
          <div style="height: 36px; border-radius: 12px; background: #6A53AD; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600;">Mark as read</div>
        </div>

        <div style="background: #FFFDFA; border: 1px solid rgba(43, 33, 58, 0.085); border-radius: 15px; padding: 13px; display: flex; flex-direction: column; gap: 9px;">
          <div style="font-size: 8.5px; font-weight: 700; letter-spacing: 1.2px; color: #8C8694;">CURRENT STREAK</div>
          <div style="display: flex; align-items: baseline; gap: 5px;">
            <div style="font-family: Spectral, Georgia, serif; font-size: 28px; font-weight: 500; line-height: 1; color: #231E2C;">14</div>
            <div style="font-size: 12px; color: #6C6577;">days</div>
          </div>
          <div style="display: flex; gap: 6px;">
            <div style="width: 18px; height: 18px; border-radius: 9px; background: #6A53AD;"></div>
            <div style="width: 18px; height: 18px; border-radius: 9px; background: #6A53AD;"></div>
            <div style="width: 18px; height: 18px; border-radius: 9px; background: #6A53AD;"></div>
            <div style="width: 18px; height: 18px; border-radius: 9px; background: #6A53AD;"></div>
            <div style="width: 18px; height: 18px; border-radius: 9px; border: 1.5px solid #A0702F; box-sizing: border-box;"></div>
            <div style="width: 18px; height: 18px; border-radius: 9px; border: 1px solid rgba(43, 33, 58, 0.15); box-sizing: border-box;"></div>
          </div>
        </div>

        <div style="background: #FFFDFA; border: 1px solid rgba(43, 33, 58, 0.085); border-radius: 15px; padding: 13px; display: flex; align-items: center; gap: 9px;">
          <div style="display: flex;">
            <div style="width: 24px; height: 24px; border-radius: 12px; background: #D9CEEC; border: 2px solid #FFFDFA; box-sizing: border-box;"></div>
            <div style="width: 24px; height: 24px; border-radius: 12px; background: #E8D6BE; border: 2px solid #FFFDFA; box-sizing: border-box; margin-left: -8px;"></div>
            <div style="width: 24px; height: 24px; border-radius: 12px; background: #CFE0D6; border: 2px solid #FFFDFA; box-sizing: border-box; margin-left: -8px;"></div>
          </div>
          <div style="font-size: 11.5px; font-weight: 600; color: #231E2C;">4 of 6 read today</div>
        </div>

      </div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
