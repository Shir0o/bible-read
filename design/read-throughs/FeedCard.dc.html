<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@300;400;500;600&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: 'Hanken Grotesk', system-ui, sans-serif; }
    a { color: #6A53AD; } a:hover { color: #5B449E; }
  </style>
</helmet>
<div style="width: 390px; height: 420px; background: #F4F0E8; color: #231E2C; box-sizing: border-box; padding: 16px 0">

  <div style="margin: 6px 12px; border-radius: 16px; background: #F5F1E9; border: 0.5px solid rgba(160,112,47,0.28); box-sizing: border-box; padding: 14px 14px 12px; display: flex; flex-direction: column; gap: 8px">
    <div style="font-size: 16px; font-weight: 700; color: #231E2C">Tony</div>

    <div style="padding: 13px 14px; border-radius: 12px; background: rgba(190,138,82,0.14); display: flex; align-items: center; gap: 12px">
      <div style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 50%; border: 1.5px solid #2A2438; background: linear-gradient(180deg, #FFE9A8 0%, #FFC24D 100%); display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2A2438" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>
      </div>
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px">
        <div style="font-family: 'Spectral', Georgia, serif; font-size: 19px; font-weight: 500; letter-spacing: -0.2px; line-height: 1.25; color: #231E2C">Finished the New Testament</div>
        <div style="font-size: 13px; color: #6E4D20">3rd time through &middot; and a 2nd whole Bible</div>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 8px">
      <div style="width: 17px; height: 17px; border-radius: 50%; background: #F6EDE3; display: flex; align-items: center; justify-content: center">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#6E4D20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>
      </div>
      <div style="font-size: 13px; color: #6C6577">Read today</div>
    </div>

    <div style="display: flex; align-items: center; gap: 8px">
      <div style="width: 22px; height: 22px; border-radius: 50%; background: #F0ECF2; display: flex; align-items: center; justify-content: center">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="#5B449E" stroke="none" aria-hidden="true"><path d="M12 21s-7.5-4.7-9.3-9A5.3 5.3 0 0 1 12 6.2 5.3 5.3 0 0 1 21.3 12c-1.8 4.3-9.3 9-9.3 9Z"></path></svg>
      </div>
      <div style="flex-grow: 1; font-size: 13px; color: #6C6577; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">Grace, Dan and 6 others</div>
    </div>
  </div>

  <div style="margin: 6px 12px; border-radius: 16px; background: #F5F1E9; border: 0.5px solid #EDEAEA; box-sizing: border-box; padding: 14px 14px 12px; display: flex; flex-direction: column; gap: 8px">
    <div style="font-size: 16px; font-weight: 700">Grace</div>
    <div style="display: flex; align-items: center; gap: 8px">
      <div style="width: 17px; height: 17px; border-radius: 50%; background: #F6EDE3; display: flex; align-items: center; justify-content: center">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#6E4D20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>
      </div>
      <div style="font-size: 13px; color: #6C6577">Read today</div>
    </div>
  </div>

  <div style="padding: 14px 20px 0; text-align: center; font-size: 13px; line-height: 1.5; color: #8C8694">A milestone rides on the day&#39;s own entry, so it keeps the same likes and comments.</div>

</div>
</x-dc>
</body>
</html>
