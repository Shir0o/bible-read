name: bible_read
description: A Bible Reading Challenge app for groups and individuals.
publish_to: none
version: 1.25.3
environment:
  sdk: ^3.5.4
dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.0.0
  cloud_firestore: ^6.3.0
  firebase_auth: ^6.4.0
  firebase_messaging: ^16.2.0
  cloud_functions: ^6.2.0
  flutter_local_notifications: ^21.0.0
  flutter_timezone: ^5.0.2
  google_sign_in: ^7.2.0
  permission_handler: ^12.0.1
  firebase_crashlytics: ^5.2.0
  timezone: ^0.11.0
  lottie: ^3.1.0
  shared_preferences: ^2.3.2
  font_awesome_flutter: ^11.0.0
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  vibration: ^3.1.3
  connectivity_plus: ^6.1.3
  rxdart: ^0.28.0
  cupertino_icons: ^1.0.8
  firebase_app_check: ^0.4.3
  custom_refresh_indicator: ^4.0.1
  dynamic_color: ^1.7.0
  google_fonts: ^6.3.3
  url_launcher: ^6.3.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  fake_cloud_firestore: ^4.1.0+1
  firebase_auth_mocks: ^0.15.1
  firebase_core_platform_interface: ^6.0.0
  google_sign_in_mocks: ^0.4.1
  google_sign_in_platform_interface: ^3.1.0
  plugin_platform_interface: ^2.1.8
  integration_test:
    sdk: flutter
  fake_firebase_security_rules: ^0.5.3
  mock_exceptions: ^0.8.2
  mocktail: ^1.0.0
  firebase_crashlytics_platform_interface: ^3.8.9
  network_image_mock: ^2.1.1
  sqflite_common_ffi: ^2.3.3
  flutter_launcher_icons: ^0.14.4
  vibration_platform_interface: any
flutter_launcher_icons:
  android: launcher_icon
  ios: true
  remove_alpha_ios: true
  image_path: assets/icons/icon.png
  min_sdk_android: 21
flutter:
  uses-material-design: true
  assets:
    - assets/plans/
    - assets/icons/
    - assets/images/
  fonts:
    - family: Spectral
      fonts:
        - asset: assets/fonts/Spectral-Light.ttf
          weight: 300
        - asset: assets/fonts/Spectral-Regular.ttf
          weight: 400
        - asset: assets/fonts/Spectral-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Spectral-Medium.ttf
          weight: 500
        - asset: assets/fonts/Spectral-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/Spectral-SemiBold.ttf
          weight: 600
    - family: Hanken Grotesk
      fonts:
        - asset: assets/fonts/HankenGrotesk-VariableFont_wght.ttf
        - asset: assets/fonts/HankenGrotesk-Italic-VariableFont_wght.ttf
          style: italic
